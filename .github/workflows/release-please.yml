# =============================================================================
# release-please — Versionado y releases automáticos.
#
# En cada push a main, release-please lee los commits nuevos (Conventional
# Commits: feat:, fix:, ...) y mantiene abierto un PR "chore(main): release X.Y.Z"
# con la nueva versión y el CHANGELOG. Al mergear ese PR crea el tag vX.Y.Z y
# la GitHub Release.
#
# Configuración: release-please-config.json y .release-please-manifest.json.
# Guía: docs/releases.md
# =============================================================================
name: release-please

on:
  push:
    branches: [main]

# Permisos mínimos que necesita el GITHUB_TOKEN: escribir contenido (tags,
# releases, rama del PR) y crear/actualizar pull requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
