# =============================================================================
# pr-title — Valida que el título de cada PR siga Conventional Commits.
#
# Con "squash merge", el título del PR se convierte en el mensaje del commit en
# main, y release-please decide la versión a partir de él:
#   feat: ...   -> versión menor (1.0.0 -> 1.1.0)
#   fix: ...    -> parche        (1.0.0 -> 1.0.1)
#   feat!: ...  -> mayor         (1.0.0 -> 2.0.0)
#
# Se usa el evento pull_request (no pull_request_target): el workflow no
# necesita secretos ni permisos de escritura, solo leer el PR.
# =============================================================================
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validar-titulo:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Scope opcional: la parte del monorepo afectada, p. ej. feat(api-usuarios): ...
          scopes: |
            api-autos
            api-usuarios
            auth-jwt
            docs
            monorepo
            main
          requireScope: false
