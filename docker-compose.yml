# =============================================================================
# docker-compose.yml — Orquestación de TODO el monorepo.
#
# Se ejecuta siempre desde la RAÍZ del repositorio. Cada servicio (backend,
# carpeta services/) o app (frontend, carpeta apps/) se declara aquí con su
# propio contexto de construcción (build: ./services/<nombre>).
#
#   docker compose build                # construir todas las imágenes
#   docker compose up -d                # levantar todo en segundo plano
#   docker compose up -d api-autos      # levantar solo un servicio
#   docker compose logs -f api-autos    # ver logs de un servicio
#   docker compose down                 # detener y eliminar los contenedores
#
# Para añadir un servicio o app: crear su carpeta con su Dockerfile y añadir
# un bloque nuevo bajo "services:" siguiendo el mismo patrón.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend: API Concesionario de Autos (FastAPI) — services/api-autos
  #
  # PostgreSQL NO corre en Docker: se usa el que está instalado en la máquina
  # (host). Desde dentro del contenedor, "localhost" es el propio contenedor,
  # por eso se llega al host con el nombre especial "host.docker.internal".
  # ---------------------------------------------------------------------------
  api-autos:
    build: ./services/api-autos
    image: api-autos:latest
    container_name: api-autos
    # Credenciales y configuración del servicio (no se copian a la imagen).
    env_file: ./services/api-autos/.env
    environment:
      # Sobrescribe DB_HOST=localhost del .env para apuntar al PostgreSQL del host.
      DB_HOST: host.docker.internal
      # Aplica `alembic upgrade head` al arrancar (false para desactivarlo).
      RUN_MIGRATIONS: "true"
    # En Docker Desktop (Mac/Windows) host.docker.internal ya existe; esta
    # línea lo habilita también en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # "ip:puerto_del_host:puerto_del_contenedor". Solo en 127.0.0.1: la API
      # no queda expuesta a otras máquinas de la red. El puerto del host es
      # 8000 por defecto; si está ocupado: API_PORT=8001 docker compose up -d
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
